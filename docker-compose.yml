services:
  db:
    image: pgvector/pgvector:pg16
    container_name: verba_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-verba}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - verba_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
    container_name: verba_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@db:5432/${POSTGRES_DB:-verba}
      DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER:-mock}
      LLAMA_CLOUD_API_KEY: ${LLAMA_CLOUD_API_KEY:-}
      PDF_PARSER: ${PDF_PARSER:-auto}
      INTERVIEW_LLM_PROVIDER: ${INTERVIEW_LLM_PROVIDER:-mock}
      CODEX_CLI_PATH: ${CODEX_CLI_PATH:-codex}
      CODEX_INTERVIEW_MODEL: ${CODEX_INTERVIEW_MODEL:-gpt-5.4-mini}
      CODEX_MAX_CONCURRENCY: ${CODEX_MAX_CONCURRENCY:-2}
      RAG_COLLECTION_NAME: ${RAG_COLLECTION_NAME:-verba_materials_v2_cosine}
      RAG_CHUNK_TOKENS: ${RAG_CHUNK_TOKENS:-420}
      RAG_CHUNK_OVERLAP_TOKENS: ${RAG_CHUNK_OVERLAP_TOKENS:-70}
      RAG_MIN_RELEVANCE: ${RAG_MIN_RELEVANCE:-0.40}
      RAG_DENSE_CANDIDATES: ${RAG_DENSE_CANDIDATES:-12}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-development-secret}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      PAYMENT_RETURN_URL: ${PAYMENT_RETURN_URL:-http://localhost:3000/settings?payment=return}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - verba_uploads:/app/uploads
      - verba_chroma:/app/chroma_db
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: verba_frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  verba_pgdata:
  verba_uploads:
  verba_chroma:
